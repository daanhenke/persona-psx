name: Megami Ibunroku Persona (JP1) - open
sha1: b5a2b10cd7ed4ec2d01fddef304191a44c37769f

options:
  platform: psx
  basename: open
  base_path: ../..
  target_path: rom/JP1/EXE/OPEN.EXE
  asm_path: asm/JP1/open
  src_path: src/open
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/open.ld
  symbol_addrs_path: configs/JP1/sym.open.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.open.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.open.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".sdata", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: True
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 0
  gp_value: 0x800B4090
  # The bss runs on past the image (the sprites, the decode buffers and the
  # title's pack at 0x80180000), so sized symbols there name their fields as
  # offsets.
  global_vram_start: 0x80080000
  global_vram_end: 0x80190000

segments:
  - name: header
    type: header
    start: 0x0
    vram: 0x80080000

  - name: open
    type: code
    start: 0x800
    vram: 0x80080000
    subsegments:
      # The memory card's file name, then the opening movie's path.
      - [0x800, .rodata, card]
      - [0x814, .rodata, movie]
      # The Psy-Q libraries' rodata, in link order after ours.
      - [0x828, rodata, psyq/rodata]
      - [0x16F4, c, main]
      - [0x1818, c, title]
      - [0x7298, c, card]
      - [0x953C, c, movie]
      - [0x9B44, c, str]
      # __main and start, then every Psy-Q library object. Not ours to
      # decompile, which is what the psyq/ prefix says.
      - [0xA030, asm, psyq/crt0]
      - [0xA048, asm, psyq/libs]
      # The save file's header and icon, then the title's text.
      - [0x21290, .data, main]
      - [0x21410, .data, title]
      - [0x21604, data, psyq/data]
      # gp small data, then the bss that the image's zero padding covers.
      - [0x34890, .sdata, main]
      - [0x34894, .sdata, title]
      # The card unit's device names.
      - [0x348AC, .sdata, card]
      - [0x348C4, sdata, open_sdata_c4]

  - [0x35000]
