name: Megami Ibunroku Persona (JP1) - adv
sha1: e843c4ec1cf3f8f7a0b362cca4f4691e7e836383

options:
  platform: psx
  basename: adv
  base_path: ../..
  target_path: rom/JP1/ADV.BIN
  asm_path: asm/JP1/adv
  src_path: src/adv
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/adv.ld
  symbol_addrs_path: configs/JP1/sym.adv.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.adv.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.adv.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  # Off for data: the overlay's workspace image is not text, and a guessed
  # string round-trips through the UTF-8 .s file as its UTF-8 bytes rather
  # than the Shift-JIS ones the ROM holds.
  data_string_guesser_level: 0

segments:
  # overlay id 7
  - name: adv
    type: code
    start: 0x0
    vram: 0x800643A0
    subsegments:
      - [0x0, rodata, adv_id]
      - [0x4, rodata, adv_rodata]
      # partyhud's ten bytes end at 0x16E; the linker pads to the next word,
      # so the asm rodata after it begins at 0x170, not in the padding.
      - [0x164, .rodata, ../common/ui/partyhud]
      - [0x170, rodata, adv_rodata1]
      - [0x1E0, .rodata, audio/silencebgm]
      - [0x1FC, rodata, adv_rodata2]
      - [0x228, .rodata, game/diagstep]
      - [0x2C4, rodata, adv_rodata3]
