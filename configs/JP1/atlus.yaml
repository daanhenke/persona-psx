name: Megami Ibunroku Persona (JP1) - atlus
sha1: 438655a6eb3b588e4b051df693040b513a4c56cf

options:
  platform: psx
  basename: atlus
  base_path: ../..
  target_path: rom/JP1/EXE/ATLUS.EXE
  asm_path: asm/JP1/atlus
  src_path: src/atlus
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/atlus.ld
  symbol_addrs_path: configs/JP1/sym.atlus.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.atlus.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.atlus.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".text", ".data", ".rodata", ".bss"]
  subalign: 4
  ld_align_section_vram_end: True
  ld_align_segment_vram_end: True
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x800A5598

segments:
  - name: header
    type: header
    start: 0x0
    vram: 0x80080000

  - name: atlus
    type: code
    start: 0x800
    vram: 0x80080000
    subsegments:
      - [0x800, asm, atlus]
      - [0x1A38, c, str]
      - [0x1AEC, asm, atlus_1]
      # Psy-Q from the library entry down; not ours to decompile.
      - [0x1E40, asm, psyq/libs]

  - [0x26000]
