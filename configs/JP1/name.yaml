name: Megami Ibunroku Persona (JP1) - name
sha1: 2b14f81398bf13ce0ac50a8219d51ff1dabf3a92

options:
  platform: psx
  basename: name
  base_path: ../..
  target_path: rom/JP1/NAME.BIN
  asm_path: asm/JP1/name
  src_path: src/name
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/name.ld
  symbol_addrs_path: configs/JP1/sym.name.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.name.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.name.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  # Off for data: the overlay's workspace image is not text, and a guessed
  # string round-trips through the UTF-8 .s file as its UTF-8 bytes rather
  # than the Shift-JIS ones the ROM holds.
  data_string_guesser_level: 0

segments:
  # overlay id 9
  - name: name
    type: code
    start: 0x0
    vram: 0x800643A0
    subsegments:
      - [0x0, .rodata, overlayid]
      - [0x4, c, ui/screen]
      - [0x1D94, c, ui/entry]
      - [0x1E40, c, ui/confirm]
      - [0x218C, c, ui/caret]
      - [0x23B8, c, ui/kanjilist]
      - [0x27D0, c, ui/dakuten]
      - [0x2BC8, c, ui/page]
      - [0x2D58, c, ui/init]
      - [0x31BC, c, ui/frame]
      - [0x354C, c, gfx/upload]
      - [0x3588, c, common/gfx/tim]
      - [0x362C, c, common/gfx/imageone]
      - [0x3694, c, common/gfx/image]
      - [0x3738, c, common/gfx/bgpack]
      - [0x3840, c, gfx/sprite]
      - [0x3A84, c, gfx/glyph]
      - [0x3B80, c, ui/keyboard]
      # The tables and initialised state, then the workspace. The file
      # carries the workspace's zeroes too, so the split sits at the first
      # variable with no initial value (the pad words at 0x80069DA0).
      - [0x3C5C, .data, ui/namedata]
      - [0x5A00, bss, name_bss]

  - [0x16900]
