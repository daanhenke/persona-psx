name: Megami Ibunroku Persona (JP1) - btlp
sha1: 1b5253963b28369cfa5d0edf6a13bbd2224a1567

options:
  platform: psx
  basename: btlp
  base_path: ../..
  target_path: rom/JP1/BTLP.BIN
  asm_path: asm/JP1/btlp
  src_path: src/btlp
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/btlp.ld
  symbol_addrs_path: configs/JP1/sym.btlp.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.btlp.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.btlp.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  # Off for data: the overlay's workspace image is not text, and a guessed
  # string round-trips through the UTF-8 .s file as its UTF-8 bytes rather
  # than the Shift-JIS ones the ROM holds - four bytes become six.
  data_string_guesser_level: 0
  # Everything the overlay reaches outside its own image lives here: the
  # resident executable's code and data. It must stop where the overlay's own
  # image starts: past that, symbol-plus-offset starts swallowing this
  # overlay's own routines into whatever symbol precedes them.
  # Without this range splat never hands those symbols to spimdisasm, so a
  # reference into the middle of one - g_btl_actors + 0x3e, say - comes out as a
  # fresh D_8005D692 instead of the offset the C actually writes, and every such
  # reference reads as a difference in objdiff.
  global_vram_start: 0x80010000
  global_vram_end: 0x800643A0

segments:
  # overlay id 5
  - name: btlp
    type: code
    start: 0x0
    vram: 0x800643A0
    subsegments:
      - [0x0, rodata, btlp_id]
      - [0x4, rodata, btlp_rodata]
      # BtlTalkSceneStep's switch table, which the C emits itself.
      - [0x44, .rodata, talkstep]
      - [0x8C, rodata, btlp_rodata0]
      - [0xE4, .rodata, talkpair]
      - [0xF4, rodata, btlp_rodata0a]
      - [0x124, .rodata, talkscenetrade]
      - [0x2DC, .rodata, talkscenepanic]
      # BtlTalkSceneCharm's thresholds and switch table, which the C emits
      # itself, behind twelve dead bytes it also carries.
      - [0x314, .rodata, talkscenecharm]
      - [0x34C, .rodata, talkscenebind]
      - [0x374, .rodata, talkscenehappy]
      # BtlPickItemFrom's tier table, which the C emits itself.
      - [0x38C, .rodata, drop]
      - [0x3D0, rodata, btlp_rodata2]
      - [0x41C, .rodata, leveltest]
      - [0x434, rodata, btlp_rodata3]
      # BtlHighlightBegin's row order, which the C emits itself.
      - [0x44C, .rodata, highlight]
      # BtlFaceDraw's three local initialisers - the quad's rotation, where it
      # stands, and its four corners - which the C emits itself.
      - [0x450, .rodata, facedraw]
      - [0x488, rodata, btlp_rodata3a]
      - [0x58C, .rodata, insert]
      - [0x5A8, rodata, btlp_rodata4]
      - [0x634, .rodata, windowstep]
      - [0x668, rodata, btlp_rodata4a]  # the assembler pads .rodata to 8
      - [0x66C, .rodata, menuupdate]
      # ovl_btlp_entry's own strings - every debug line it announces a step
      # with, and the ten pack names it looks up on the disc. The C emits them
      # byte for byte already; this becomes `.rodata, entry` the moment the
      # routine itself comes out of asm, and not before - under INCLUDE_ASM the
      # body is not compiled, so nothing would emit them.
      - [0x684, rodata, btlp_rodata5]
      - [0x7B4, .rodata, bindgfx]
      - [0x7C8, rodata, btlp_rodata6]
      # Only BtlChooseEnemyMove's table, because it is the one routine in
      # roundflow.c that is already out of asm. The unit's rodata really starts
      # at 0x8D8 - BtlStageRound's five tables and the word behind them sit in
      # btlp_rodata6 until that routine matches, and this becomes
      # `[0x8D8, .rodata, roundflow]` when it does. The C already emits exactly
      # 0x3FC bytes there, which is the whole 0x8D8..0xCD4 span.
      - [0xA50, .rodata, roundflow]
      - [0xCD4, rodata, btlp_rodata6a]
      # BtlRollDefeatDrop's rate table, which the C emits itself, and the word of
      # padding behind it that belongs to nobody.
      - [0xD80, .rodata, defeatdrop]
      - [0xD94, rodata, btlp_rodata6a1]
      # BtlHoldForMarkers's switch table, which the C emits itself.
      - [0xD98, .rodata, holdmarkers]
      - [0xDB0, rodata, btlp_rodata6b]
      # BtlMemberMotion05's switch table, which memberact.c emits itself.
      # The two tables in front of it belong to the same unit and join
      # this segment as their routines come out of asm.
      - [0x119C, .rodata, memberact]
      - [0x11B0, rodata, btlp_rodata6b1]
      # 0x1990 is where the leading rodata block ends and text begins.
      - [0x1990, asm, btlp_pre]
