name: Megami Ibunroku Persona (JP1) - s2d
sha1: fe25e5c709a046523af272449c9c1f7ee7d1b563

options:
  platform: psx
  basename: s2d
  base_path: ../..
  target_path: rom/JP1/S2D.BIN
  asm_path: asm/JP1/s2d
  src_path: src/s2d
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/s2d.ld
  symbol_addrs_path: configs/JP1/sym.s2d.txt
  reloc_addrs_path: configs/JP1/reloc.s2d.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.s2d.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.s2d.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  # Off for data: the overlay's workspace image is not text, and a guessed
  # string round-trips through the UTF-8 .s file as its UTF-8 bytes rather
  # than the Shift-JIS ones the ROM holds.
  data_string_guesser_level: 0
  # Everything the overlay reaches outside its own image: the resident
  # executable's code and data, as btlp.yaml has it. Without the range a
  # reference into the middle of a main symbol - g_persona_data + 0x26 - comes
  # out as a fresh D_ label rather than the offset the C writes.
  global_vram_start: 0x80010000
  global_vram_end: 0x800643A0

segments:
  # overlay id 6
  - name: s2d
    type: code
    start: 0x0
    vram: 0x800643A0
    subsegments:
      - [0x0, rodata, s2d_id]
      # 0x4..0xE80 is the leading rodata block; the entry point is at 0xE80.
      - [0x4, rodata, s2d_rodata]
      - [0x70, .rodata, ui/itemtop]
      - [0x90, .rodata, ui/statusmenu]
      - [0xF0, .rodata, game/formationmenu]
      - [0x114, pad, s2d_pad_114]
      - [0x118, .rodata, ui/configmenu]
      # partyhud is ten bytes; the linker pads to the next word.
      - [0x13C, .rodata, common/ui/partyhud]
      - [0x148, pad, s2d_pad_148]
      - [0x14C, .rodata, common/ui/menumember]
      - [0x160, .rodata, common/game/equippick]
      - [0x17C, .rodata, common/game/itemuse]
      - [0x31C, .rodata, common/game/spellusable]
      - [0x544, .rodata, common/game/spelleffect]
      - [0x598, pad, s2d_pad_598]
      - [0x59C, .rodata, game/itemusableany]
      # the item table is 21 words; the pad word after it is not the C's.
      - [0x5F0, pad, s2d_pad_5f0]
      - [0x5F4, .rodata, game/charbelowmax]
      - [0x61C, .rodata, ui/tacticlists]
      - [0x634, .rodata, common/game/equip]
      - [0x690, pad, s2d_pad_690]
      # the two stat-bar units emit their own switch tables.
      - [0x694, .rodata, common/gfx/statbars]
      - [0x6F0, pad, s2d_pad_6f0]
      - [0x6F4, .rodata, common/gfx/statbarsdata]
      - [0x708, pad, s2d_pad_708]
