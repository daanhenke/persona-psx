name: Megami Ibunroku Persona (JP1) - dng
sha1: 035300c55c8f468e3946e35aaa6e2018df36d7f5

options:
  platform: psx
  basename: dng
  base_path: ../..
  target_path: rom/JP1/DNG.BIN
  asm_path: asm/JP1/dng
  src_path: src/dng
  build_path: build/JP1
  o_path: lib
  ld_script_path: linkers/JP1/dng.ld
  symbol_addrs_path: configs/JP1/sym.dng.txt
  reloc_addrs_path: configs/JP1/reloc.dng.txt
  undefined_syms_auto_path: linkers/JP1/undefined_syms_auto.dng.txt
  undefined_funcs_auto_path: linkers/JP1/undefined_funcs_auto.dng.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  # Off for data: the overlay's workspace image is not text, and a guessed
  # string round-trips through the UTF-8 .s file as its UTF-8 bytes rather
  # than the Shift-JIS ones the ROM holds.
  data_string_guesser_level: 0
  # The resident executable, so a reference into the middle of one of its
  # sized tables comes out as symbol plus offset (see btlp.yaml).
  global_vram_start: 0x80010000
  global_vram_end: 0x800643A0

segments:
  # overlay id 4
  - name: dng
    type: code
    start: 0x0
    vram: 0x800643A0
    subsegments:
      - [0x0, rodata, dng_id]
      # 0x4..0x98C is the leading rodata block; the entry point is at 0x98C.
      - [0x4, .rodata, field/fieldmain]
      - [0x38, rodata, dng_rodata]
      - [0x3C, .rodata, field/fielddoor]
      - [0x60, rodata, dng_rodata0b]
      - [0x64, .rodata, field/fieldexit]
      - [0x78, rodata, dng_rodata0c]
      - [0x88, .rodata, field/fieldscript]
      - [0x1D8, rodata, dng_rodata0d]
      - [0x22C, .rodata, ui/mainmenu]
      - [0x244, rodata, dng_rodata0e]
      - [0x2C4, .rodata, ui/formationmenu]
      # the step table is nine words; the pad word after it is not the C's.
      - [0x2E8, rodata, dng_rodata0f]
      - [0x2EC, .rodata, ui/configmenu]
      - [0x310, rodata, dng_rodata0g]
      - [0x4F0, .rodata, common/game/spellusable]
      - [0x718, rodata, dng_rodata1]
      - [0x808, .rodata, common/game/equip]
      - [0x844, rodata, dng_rodata2]
      # the two stat-bar units emit their own switch tables.
      - [0x868, .rodata, common/gfx/statbars]
      - [0x8AC, rodata, dng_rodata2a]
      - [0x8C8, .rodata, common/gfx/statbarsdata]
      - [0x8DC, rodata, dng_rodata2b]
