name: "Revelations: Persona (US) - movie"
sha1: 9e2bae1ef5262c16a3827d49cbf6ad34bb320375

options:
  platform: psx
  basename: movie
  base_path: ../..
  target_path: rom/US/EXE/MOVIE.EXE
  asm_path: asm/US/movie
  src_path: src/movie
  build_path: build/US
  o_path: lib
  ld_script_path: linkers/US/movie.ld
  symbol_addrs_path: configs/US/sym.movie.txt
  undefined_syms_auto_path: linkers/US/undefined_syms_auto.movie.txt
  undefined_funcs_auto_path: linkers/US/undefined_funcs_auto.movie.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".text", ".data", ".rodata", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: True
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  gp_value: 0x800A9E7C

# Not decompiled for US yet: plain asm, so the US progress report counts
# the whole target. Boundaries mapped from the JP1 config by matching code;
# psyq/ is kept out of the report, as in JP1.
segments:
  - name: header
    type: header
    start: 0x0
    vram: 0x80080000

  - name: movie
    type: code
    start: 0x800
    vram: 0x80080000
    subsegments:
      - [0x800, asm, movie]
      - [0x1D3C, asm, psyq/libs]
      - [0x17264, data, psyq/data]

  - [0x2A800]
