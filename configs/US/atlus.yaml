name: "Revelations: Persona (US) - atlus"
sha1: 3cc3c8c3edb8907071e21131ad13046be8da9c49

options:
  platform: psx
  basename: atlus
  base_path: ../..
  target_path: rom/US/EXE/ATLUS.EXE
  asm_path: asm/US/atlus
  src_path: src/atlus
  build_path: build/US
  o_path: lib
  ld_script_path: linkers/US/atlus.ld
  symbol_addrs_path: configs/US/sym.atlus.txt
  undefined_syms_auto_path: linkers/US/undefined_syms_auto.atlus.txt
  undefined_funcs_auto_path: linkers/US/undefined_funcs_auto.atlus.txt
  compiler: GCC
  find_file_boundaries: True
  create_asm_dependencies: True
  disassemble_all: False
  hasm_in_src_path: True
  o_as_suffix: False
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False
  section_order: [".text", ".data", ".rodata", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: True
  ld_bss_is_noload: False
  symbol_name_format: $VRAM
  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  gp_value: 0x800A9EC8

# Not decompiled for US yet: plain asm, so the US progress report counts
# the whole target. Boundaries mapped from the JP1 config by matching code;
# psyq/ is kept out of the report, as in JP1.
segments:
  - name: header
    type: header
    start: 0x0
    vram: 0x80080000

  - name: atlus
    type: code
    start: 0x800
    vram: 0x80080000
    subsegments:
      - [0x800, asm, atlus]
      - [0x2090, asm, psyq/libs]
      - [0x17444, data, psyq/data]

  - [0x2A800]
