name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.ksy'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.ksy'

jobs:
  # What the push or pull request actually touched. Every job below is gated on
  # this, so a change to one half of the repository does not pay for the other.
  changes:
    if: github.repository == 'daanhenke/persona-psx'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      sources: ${{ steps.filter.outputs.sources }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'
            sources:
              - 'src/**'
              - 'include/**'
              - 'asm/**'
              - 'configs/**'
              - 'linkers/**'
              - 'lib/**'
              - 'assets/**'
              - 'tools/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # The build environment the other jobs run in. Only the Dockerfile and what it
  # installs can change it, so it is built only when one of those moves; the
  # tagged image from the last such push is what the jobs below pull otherwise.
  # When it does run, `needs` holds those jobs back, so they can never race a
  # Dockerfile change and run against the previous image.
  image:
    needs: changes
    if: |
      github.repository == 'daanhenke/persona-psx' &&
      (needs.changes.outputs.image == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default docker driver cannot export to the GHA cache; buildx with
      # the docker-container driver can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/daanhenke/persona-psx-buildenv:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check:
    name: Check Executables Match
    needs: [ changes, image ]
    # `always()` so a skipped image job does not skip this one with it; the
    # result check is what stops it running against an image that failed.
    if: |
      always() &&
      github.repository == 'daanhenke/persona-psx' &&
      needs.image.result != 'failure' && needs.image.result != 'cancelled' &&
      (needs.changes.outputs.sources == 'true' ||
       github.event_name == 'workflow_dispatch')

    container:
      image: ghcr.io/daanhenke/persona-psx-buildenv:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: true
      matrix:
        game_version: [ JP1 ]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The executables the build is checked against. They are not in this
      # repository; a read-only deploy key gets them from the private one.
      - name: Checkout reference executables
        uses: actions/checkout@v4
        with:
          repository: daanhenke/persona-psx-disks
          ssh-key: ${{ secrets.DISKS_DEPLOY_KEY }}
          path: .disks

      - name: Place reference executables
        run: |
          mkdir -p rom
          cp -r .disks/JP1 rom/
          cp -r .disks/US rom/ || true

      # Only splat has to run: `make setup` would extract from a disc image,
      # and there is no disc here - just the executables it would have produced.
      - name: Generate
        run: make GAME_VERSION=${{ matrix.game_version }} generate

      - name: Check executables match
        run: make GAME_VERSION=${{ matrix.game_version }} CHECKSUM=1 build

  progress:
    name: Determine and Push Progress
    needs: [ changes, image ]
    if: |
      always() &&
      github.repository == 'daanhenke/persona-psx' &&
      needs.image.result != 'failure' && needs.image.result != 'cancelled' &&
      (needs.changes.outputs.sources == 'true' ||
       github.event_name == 'workflow_dispatch')

    container:
      image: ghcr.io/daanhenke/persona-psx-buildenv:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: true
      matrix:
        game_version: [ JP1 ]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout reference executables
        uses: actions/checkout@v4
        with:
          repository: daanhenke/persona-psx-disks
          ssh-key: ${{ secrets.DISKS_DEPLOY_KEY }}
          path: .disks

      - name: Place reference executables
        run: |
          mkdir -p rom
          cp -r .disks/JP1 rom/
          cp -r .disks/US rom/ || true

      # No `generate` step here: report -> objdiff-config -> objdiff-generate
      # starts with `regenerate`, which resets and regenerates everything, so
      # anything done first is thrown away.
      #
      # Writes build/<version>/progress.json in objdiff's report format, which
      # is what decomp.dev reads.
      - name: Generate progress report
        run: make GAME_VERSION=${{ matrix.game_version }} report

      - name: Show progress
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('build/${{ matrix.game_version }}/progress.json'))['measures']
          print('functions %d/%d  %.2f%%' % (m['matched_functions'],
                                             m['total_functions'],
                                             m['matched_functions_percent']))
          print('code      %s/%s  %.2f%%' % (m['matched_code'], m['total_code'],
                                             m['matched_code_percent']))
          PY

      # decomp.dev reads the report from this artifact.
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game_version }}_report
          path: ./build/${{ matrix.game_version }}/progress.json
          if-no-files-found: error
