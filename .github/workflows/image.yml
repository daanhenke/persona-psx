name: Build Container Image

# The build environment the other two workflows run in. Rebuilt when the
# Dockerfile or the Python requirements change, and on demand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/image.yml'

jobs:
  image:
    if: github.repository == 'daanhenke/persona-psx'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default docker driver cannot export to the GHA cache; buildx with
      # the docker-container driver can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/daanhenke/persona-psx-buildenv:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
